services:
  ten-parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: ten-parser:latest
    container_name: ten-parser
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m
